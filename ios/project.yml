name: RustyAlarm

options:
  bundleIdPrefix: com.example.rustyalarm
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

targets:
  RustyAlarm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rustyalarm
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RustyAlarm.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RustyAlarmWidget
        embed: true

  RustyAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rustyalarm.widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RustyAlarmWidget.entitlements

  RustyAlarmWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rustyalarm.watchkitapp
        INFOPLIST_FILE: Resources/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RustyAlarmWatch.entitlements
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"

  RustyAlarmTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: RustyAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rustyalarm.tests

schemes:
  RustyAlarm:
    build:
      targets:
        RustyAlarm: all
    run:
      config: Debug
    test:
      targets:
        - RustyAlarmTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
