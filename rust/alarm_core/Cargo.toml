[package]
name = "alarm_core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "alarm_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
jni = { version = "0.21", default-features = false }

# NOTE: UniFFI migration is documented in `src/alarm_core.udl` and README.
# Enable it by adding:
#   uniffi = { version = "0.27" }
#   [build-dependencies] uniffi = { version = "0.27", features = ["build"] }
# Then run `uniffi-bindgen generate src/alarm_core.udl --language kotlin`.
